<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="技术思考">
  <meta name="theme-color" content="#03100a">
  <title>posts — T-Dwag</title>
  <link rel="preload" href="fonts/pixel-core.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="moss.css">
  <script src="api-base.js"></script>
  <script src="site.js"></script>
  <script src="moss.js"></script>
</head>
<body>
  <div class="app">
    <nav class="side" aria-label="主导航">
      <a class="brand" href="index.html">t-dwag<i>@blog</i></a>
      <div class="navs"><a class="nv" href="index.html">home</a><a class="nv" href="about.html">about</a><a class="nv" href="posts.html" aria-current="page">posts</a><a class="nv" href="projects.html">projects</a><a class="nv" href="guestbook.html">guestbook</a><a class="nv" href="chat.html">chat</a><a class="nv" href="search.html">search</a></div>
      <div class="ext"><a href="mailto:wuonchannel@gmail.com">mail ↗</a><a href="https://github.com/T-DWAG" target="_blank" rel="noreferrer">github ↗</a></div>
    </nav>
    <div class="main">
      <main class="page">
      <header class="head">
        <p class="meta" id="postsMeta">ls ~/posts</p>
        <h1>技术思考</h1>
        <p class="lede">A system you can't observe is a system you can't own.</p>
      </header>
      <div class="rows" id="postsList"><p class="meta" style="padding:8px">加载中…</p></div>
      <p class="meta" style="margin-top:20px"><a href="search.html">search →</a></p>
      </main>
      <footer class="foot"><a href="mailto:wuonchannel@gmail.com">wuonchannel@gmail.com</a><a href="https://github.com/T-DWAG" target="_blank" rel="noreferrer">github.com/T-DWAG</a><span>© 2026 T-Dwag</span></footer>
    </div>
    <aside class="ai" id="ai" aria-label="MOSS">
      <header class="ai-head"><span class="moss-orb" data-moss-orb="44" aria-hidden="true"></span><span class="ai-name">MOSS<small>问我关于他的任何事</small></span><span class="ai-st" id="aiSt">连接中</span></header>
      <div class="chat-body" id="chatBody" aria-live="polite"><p><span class="who">me$</span> <span class="reply-text" id="mossFirstLine"></span></p></div>
      <div class="chat-suggestions" id="chatSuggestions"></div>
      <form class="cmd chat-input" id="chatForm">
        <span class="who" aria-hidden="true">you$</span>
        <input type="text" id="chatInput" placeholder="输入问题，回车发送" autocomplete="off" aria-label="向 MOSS 提问">
        <button type="button" id="chatStop" class="chat-stop" hidden>停止</button>
      </form>
    </aside>
  </div>
  <script src="chat-panel.js"></script>
  <script src="panel-status.js"></script>
  <script>
    (function () {
      var list = document.getElementById('postsList');
      var tag = new URLSearchParams(location.search).get('tag') || '';
      if (tag) document.getElementById('postsMeta').textContent = 'ls ~/posts --tag ' + tag;
      $api('/api/articles' + (tag ? '?tag=' + encodeURIComponent(tag) : '')).then(function (env) {
        var d = env.data || [];
        if (!d.length) { list.innerHTML = '<p class="meta" style="padding:8px">' + (tag ? '没有带标签 “' + $esc(tag) + '” 的文章' : '还没有发布的文章') + '</p>'; return; }
        list.innerHTML = d.map(function (a) {
          return '<a class="row" href="article.html?slug=' + encodeURIComponent(a.slug) + '"><span class="meta">' + $day(a) + '</span><span>' + $esc(a.title) + (a.is_pinned ? ' <span class="ps">*</span>' : '') + '</span><span class="go-arrow">→</span></a>';
        }).join('');
      }).catch(function () { list.innerHTML = '<p class="meta err" style="padding:8px">文章列表加载失败，稍后再试</p>'; });
    })();
  </script>
</body>
</html>
