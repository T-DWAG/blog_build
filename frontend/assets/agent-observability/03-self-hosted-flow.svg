<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f7f9fc"/>
  <text x="70" y="72" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#172033">从 Callback 到自建观测后端</text>
  <text x="70" y="112" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" fill="#667085">数据留在自己的系统里，再按需要接 API、指标、评估和 OTel</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3978d8"/></marker>
  </defs>
  <rect x="65" y="245" width="185" height="120" rx="16" fill="#e8f1ff" stroke="#3978d8" stroke-width="3"/>
  <text x="157" y="290" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#1d4f9e">Eino</text>
  <text x="157" y="325" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#344054">Callback 事件</text>
  <path d="M250 305 H350" stroke="#3978d8" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="350" y="220" width="210" height="170" rx="16" fill="#fff4e5" stroke="#e58b25" stroke-width="3"/>
  <text x="455" y="268" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#9a5b0b">Trace / Span</text>
  <text x="455" y="305" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#7a4a11">Agent</text>
  <text x="455" y="333" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#7a4a11">ChatModel</text>
  <text x="455" y="361" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#7a4a11">Tool</text>
  <path d="M560 305 H660" stroke="#3978d8" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="660" y="245" width="220" height="120" rx="16" fill="#ffffff" stroke="#344054" stroke-width="3"/>
  <text x="770" y="290" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#172033">PostgreSQL</text>
  <text x="770" y="325" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#667085">自建 / 可控 / 可隔离</text>
  <path d="M880 305 H980" stroke="#3978d8" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="980" y="190" width="160" height="230" rx="16" fill="#ffffff" stroke="#3978d8" stroke-width="3"/>
  <text x="1060" y="230" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#172033">可继续接</text>
  <text x="1060" y="275" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#3978d8">Trace API</text>
  <text x="1060" y="315" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#3978d8">Metrics</text>
  <text x="1060" y="355" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#3978d8">Eval</text>
  <text x="1060" y="395" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#3978d8">OTel → Jaeger</text>
  <rect x="155" y="500" width="890" height="76" rx="14" fill="#eef6ee" stroke="#68a56a" stroke-width="2"/>
  <text x="600" y="548" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#356b39">不是只把数据发到某个平台，而是把数据留在自己的系统里</text>
</svg>
