<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="搜索文章与项目。">
  <meta name="theme-color" content="#000000">
  <title>go /search — 从气象到代码</title>
  <link rel="preload" href="fonts/fusion-pixel-12px-proportional-zh_hans.subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/fusion-pixel-12px-monospaced-zh_hans.subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="win pixel-round">

    <!-- 窗口标题栏 -->
    <header class="winbar">
      <div class="winbar-lights" aria-hidden="true">
        <i class="r"></i><i class="y"></i><i class="g"></i>
      </div>
      <span class="winbar-path">t-dwag@blog: <b>~/search</b></span>
      <span class="winbar-go">[go]</span>
    </header>

    <!-- go 命令导航 -->
    <nav class="gonav" id="gonav" aria-label="主导航">
      <span class="gonav-prompt" aria-hidden="true">$</span>
      <button class="gonav-toggle" type="button" aria-expanded="false" aria-controls="gonav-links">导航 ▾</button>
      <div class="gonav-links" id="gonav-links">
        <a href="index.html">go /home</a>
        <a href="about.html">go /about</a>
        <a href="posts.html">go /posts</a>
        <a href="projects.html">go /projects</a>
        <a href="guestbook.html">go /guestbook</a>
        <a href="chat.html">go /chat</a>
        <a class="is-active" href="search.html">go /search</a>
      </div>
    </nav>

    <main>
      <section class="section section-paper" aria-labelledby="search-title">
        <div class="container">
          <p class="section-kicker">SEARCH</p>
          <h2 id="search-title"><span>全站搜索</span></h2>
          <p class="section-intro">检索范围：文章标题、文章正文、项目标题。结果按「文章 / 项目」分组。</p>

          <!-- 搜索：后端就绪后 GET /api/search?q= -->
          <form class="search-bar" id="searchForm">
            <span class="s-prompt" aria-hidden="true">$</span>
            <input type="search" id="searchInput" placeholder="grep -r 'singleflight'" autocomplete="off">
            <span class="cursor" aria-hidden="true"></span>
          </form>
          <p class="search-hint" id="searchHint"><span class="dim"># 搜索接口将在后端就绪后接入,当前为静态演示</span></p>
          <div id="searchResults" style="margin-top:28px"></div>
        </div>
      </section>
    </main>

    <footer class="statusbar">
      <span>© 2025 · 从气象到代码</span>
      <span>·</span>
      <a href="mailto:wuonchannel@gmail.com">wuonchannel@gmail.com</a>
      <span>·</span>
      <a href="https://github.com/T-DWAG" target="_blank" rel="noreferrer">github.com/T-DWAG</a>
      <span>·</span>
      <span class="end-flag">END</span>
    </footer>
  </div>

  <script>
    (function () {
      var toggle = document.querySelector('.gonav-toggle');
      var gonav = document.getElementById('gonav');
      if (!toggle || !gonav) return;
      toggle.addEventListener('click', function () {
        var open = gonav.classList.toggle('is-open');
        toggle.setAttribute('aria-expanded', String(open));
        toggle.textContent = open ? '导航 ▴' : '导航 ▾';
      });
    })();

    // 静态演示：匹配当前已知文章标题（后端 /api/search 就绪后替换）
    var form = document.getElementById('searchForm');
    var input = document.getElementById('searchInput');
    var hint = document.getElementById('searchHint');
    var results = document.getElementById('searchResults');
    var index = [
      { type: '文章', name: 'singleflight：用一次查询合并一批并发请求', url: 'articles/singleflight.html' },
      { type: '文章', name: '课程短链接项目的 SSRF 风险：从发现到修复思路', url: 'posts.html' },
      { type: '文章', name: 'MySQL、ES 与 Redis：评价查询链路的一致性设计', url: 'posts.html' },
      { type: '文章', name: 'Agent 工具设计三原则：失败语义、最少入参、幂等', url: 'posts.html' },
      { type: '文章', name: '为什么 Agent 的瓶颈在工程，不在模型', url: 'posts.html' },
      { type: '项目', name: 'AI Agent 智能平台', url: 'projects.html' },
      { type: '项目', name: '电商评价系统', url: 'projects.html' },
      { type: '项目', name: '短链接服务', url: 'projects.html' }
    ];
    function render(q) {
      if (!q) { results.innerHTML = ''; return; }
      var hits = index.filter(function (it) {
        return it.name.toLowerCase().indexOf(q.toLowerCase()) > -1;
      });
      if (!hits.length) {
        results.innerHTML = '<p class="search-hint"><span class="err">> grep: no matches found: "' + q + '"</span></p>';
        return;
      }
      var html = '<div class="ls">';
      hits.forEach(function (it) {
        html += '<a class="ls-row" href="' + it.url + '"><span>' + it.type + '</span><span class="ls-dot">::</span><span style="grid-column:span 2">' + it.name + '</span><span class="ls-name" style="grid-column:auto">go →</span></a>';
      });
      html += '</div>';
      results.innerHTML = html;
    }
    if (form) {
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        render(input.value);
        hint.textContent = '# 搜索接口将在后端就绪后接入,当前为静态演示';
      });
    }
  </script>
</body>
</html>
