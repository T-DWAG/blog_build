<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="留言板">
  <meta name="theme-color" content="#03100a">
  <title>guestbook — T-Dwag</title>
  <link rel="preload" href="fonts/pixel-core.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="moss.css">
  <script src="api-base.js"></script>
  <script src="site.js"></script>
  <script src="moss.js"></script>
</head>
<body>
  <div class="app">
    <nav class="side" aria-label="主导航">
      <a class="brand" href="index.html">t-dwag<i>@blog</i></a>
      <div class="navs"><a class="nv" href="index.html">home</a><a class="nv" href="about.html">about</a><a class="nv" href="posts.html">posts</a><a class="nv" href="projects.html">projects</a><a class="nv" href="guestbook.html" aria-current="page">guestbook</a><a class="nv" href="chat.html">chat</a><a class="nv" href="search.html">search</a></div>
      <div class="ext"><a href="mailto:wuonchannel@gmail.com">mail ↗</a><a href="https://github.com/T-DWAG" target="_blank" rel="noreferrer">github ↗</a></div>
    </nav>
    <div class="main">
      <main class="page">
      <header class="head">
        <p class="meta">~/guestbook</p>
        <h1>留言</h1>
        <p class="lede">想法、建议，或者只是打个招呼。提交后需站主审核才会展示。</p>
      </header>
      <form id="gbForm" novalidate>
        <label class="field"><span>昵称</span><input type="text" name="nickname" maxlength="24" placeholder="怎么称呼你" required></label>
        <label class="field"><span>内容</span><textarea name="content" maxlength="500" placeholder="写下你的留言…" required></textarea></label>
        <button class="go" type="submit">go send</button>
        <p class="meta" id="gbNote" style="margin-top:14px"></p>
      </form>
      <section class="sec" id="gbList"></section>
      </main>
      <footer class="foot"><a href="mailto:wuonchannel@gmail.com">wuonchannel@gmail.com</a><a href="https://github.com/T-DWAG" target="_blank" rel="noreferrer">github.com/T-DWAG</a><span>© 2026 T-Dwag</span></footer>
    </div>
    <aside class="ai" id="ai" aria-label="MOSS">
      <header class="ai-head"><span class="moss-orb" data-moss-orb="44" aria-hidden="true"></span><span class="ai-name">MOSS<small>问我关于他的任何事</small></span><span class="ai-st" id="aiSt">连接中</span></header>
      <div class="chat-body" id="chatBody" aria-live="polite"><p><span class="who">me$</span> <span class="reply-text" id="mossFirstLine"></span></p></div>
      <div class="chat-suggestions" id="chatSuggestions"></div>
      <form class="cmd chat-input" id="chatForm">
        <span class="who" aria-hidden="true">you$</span>
        <input type="text" id="chatInput" placeholder="输入问题，回车发送" autocomplete="off" aria-label="向 MOSS 提问">
        <button type="button" id="chatStop" class="chat-stop" hidden>停止</button>
      </form>
    </aside>
  </div>
  <script src="chat-panel.js"></script>
  <script src="panel-status.js"></script>
  <script>
    (function () {
      var form = document.getElementById('gbForm'), list = document.getElementById('gbList'), note = document.getElementById('gbNote');
      function say(t, bad) { note.innerHTML = bad ? '<span class="err">' + $esc(t) + '</span>' : $esc(t); }
      function load() {
        $api('/api/messages').then(function (env) {
          var d = env.data || [];
          if (!d.length) { list.innerHTML = '<p class="meta">还没有留言，来抢沙发。</p>'; return; }
          list.innerHTML = d.map(function (m) {
            return '<article class="msg"><p class="meta">' + $esc(m.nickname) + ' · ' + $esc((m.created_at || '').slice(0, 16)) + '</p><p>' + $esc(m.content) + '</p></article>';
          }).join('');
        }).catch(function () { list.innerHTML = '<p class="meta err">留言加载失败，稍后再试</p>'; });
      }
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var n = form.nickname.value.trim(), c = form.content.value.trim();
        if (!n || !c) { say('昵称和内容都要填', true); return; }
        $api('/api/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nickname: n, content: c }) })
          .then(function (env) {
            if (env.code === 0) { say('已提交，等待站主审核后展示。'); form.content.value = ''; }
            else if (env.code === 429) say('一分钟内只能提交一条，稍后再试', true);
            else say(env.msg || '提交失败', true);
          }).catch(function () { say('网络错误，稍后再试', true); });
      });
      load();
    })();
  </script>
</body>
</html>
