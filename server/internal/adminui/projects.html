<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>projects — T-Dwag admin</title>
<link rel="preload" href="/admin-assets/fonts/pixel-core.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/admin-assets/admin.css">
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Admin">
    <a class="brand" href="/admin/articles">t-dwag<i>@blog</i><small>admin console</small></a>
    <div class="navs">
      <a class="nv" href="/admin/articles">articles</a>
      <a class="nv" href="/admin/projects" aria-current="page">projects</a>
      <a class="nv" href="/admin/messages">messages</a>
      <a class="nv" href="/admin/settings">settings</a>
    </div>
    <div class="side-foot">
      <span class="st" id="st">connected</span>
      <a href="/admin/logout">logout ↗</a>
    </div>
  </nav>
  <div class="main">
    <div class="strip">
      <span>t-dwag@blog:<b>~/admin/projects</b></span>
      <span class="meta" id="count"></span>
    </div>
    <div class="page">
      <header class="head">
        <p class="meta">ls ~/projects</p>
        <h1>Projects<span class="zh">项目管理 · sort_order 大在前 · 未上线对访客不可见</span></h1>
      </header>
      <section class="pane"><span class="pt">list</span>
        <div class="rowline"><a class="go" href="#" id="newBtn">+ new project</a></div>
        <table class="tbl">
          <thead><tr><th>ID</th><th>NAME</th><th>SORT</th><th>STATUS</th><th>TAGS</th><th>ACTIONS</th></tr></thead>
          <tbody id="rows"><tr><td colspan="6"><span class="meta">loading…</span></td></tr></tbody>
        </table>
        <div id="confirmStage"></div>
      </section>
    </div>
  </div>
</div>

<div class="scrim" id="formWrap" style="display:none">
  <div class="modal">
    <h1 id="formTitle">New project<span class="zh">新建项目</span></h1>
    <label class="field"><span>name *</span><input type="text" id="f_name"></label>
    <label class="field"><span>summary</span><input type="text" id="f_summary"></label>
    <label class="field"><span>cover url</span><input type="text" id="f_cover"></label>
    <label class="field"><span>repo url</span><input type="text" id="f_repo"></label>
    <label class="field"><span>home url</span><input type="text" id="f_home"></label>
    <label class="field"><span>demo url</span><input type="text" id="f_demo"></label>
    <label class="field"><span>tags *<i class="hint">逗号分隔</i></span><input type="text" id="f_tags"></label>
    <div class="field-row">
      <label class="field" style="flex:1"><span>sort order<i class="hint">大在前</i></span><input type="text" id="f_sort" value="0"></label>
      <label class="field" style="flex:1"><span>published<i class="hint">上线后访客可见</i></span>
        <select id="f_pub"><option value="true">online</option><option value="false">offline</option></select>
      </label>
    </div>
    <label class="field"><span>detail (markdown)</span><textarea id="f_detail"></textarea></label>
    <div class="rowline">
      <button class="go" id="saveBtn" type="button">save project</button>
      <button class="btn2" id="cancelBtn" type="button">cancel</button>
    </div>
    <p class="err" id="formErr" style="margin-top:14px;min-height:20px"></p>
  </div>
</div>

<script src="/admin-assets/admin.js"></script>
<script>
(function(){
  var rows=document.getElementById('rows');
  var stage=document.getElementById('confirmStage');
  var wrap=document.getElementById('formWrap');
  var editing=null;

  function cell(en,zh,cls){
    var s=document.createElement('span');
    s.className=cls||'meta';
    s.appendChild(document.createTextNode(en));
    if(zh){var z=document.createElement('span'); z.className='zh-i'; z.textContent=zh; s.appendChild(z);}
    return '<tr><td colspan="6">'+s.outerHTML+'</td></tr>';
  }

  function load(){
    fetch('/api/admin/projects').then(function(r){
      if(r.status===401){location.href='/admin/login';throw new Error('redirect');}
      return r.json();
    }).then(function(env){
      var items=env.data||[];
      var online=items.filter(function(p){return p.published;}).length;
      document.getElementById('count').textContent=items.length+' projects · '+online+' online';
      if(!items.length){rows.innerHTML=cell('no projects yet','还没有项目');return;}
      rows.innerHTML=items.map(function(p){
        var st=p.published?'<span class="pill on">online</span>':'<span class="pill">offline</span>';
        var tags=(p.tags||[]).map(function(t){return '<span class="tag">'+t+'</span>';}).join('');
        return '<tr>'+
          '<td class="meta">'+p.id+'</td><td>'+p.name+'</td><td class="meta">'+p.sort_order+'</td><td>'+st+'</td><td>'+tags+'</td>'+
          '<td class="act"><a href="#" data-edit="'+p.id+'">edit</a><a href="#" class="danger" data-del="'+p.id+'" data-name="'+p.name+'">delete</a></td></tr>';
      }).join('');
      rows.querySelectorAll('[data-edit]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();openForm(Number(a.getAttribute('data-edit')));});});
      rows.querySelectorAll('[data-del]').forEach(function(a){a.addEventListener('click',function(e){
        e.preventDefault();
        var id=a.getAttribute('data-del');
        var name=a.getAttribute('data-name');
        AdminConfirm(stage,'delete project','"'+name+'"','删除后不可恢复',function(){
          fetch('/api/admin/projects/'+id,{method:'DELETE'}).then(function(r){ if(r.ok) load(); });
        });
      });});
    }).catch(function(e){
      if(e.message!=='redirect') rows.innerHTML=cell('failed to load','加载失败，稍后再试','err');
    });
  }

  function openForm(id){
    editing=id;
    document.getElementById('formTitle').innerHTML=(id?'Edit project #'+id:'New project')+'<span class="zh">'+(id?'编辑项目':'新建项目')+'</span>';
    ['f_name','f_summary','f_cover','f_repo','f_home','f_demo','f_tags','f_sort','f_detail'].forEach(function(x){document.getElementById(x).value='';});
    document.getElementById('f_pub').value='true';
    if(id){
      fetch('/api/admin/projects').then(function(r){return r.json();}).then(function(env){
        var p=(env.data||[]).find(function(x){return x.id===id;});
        if(!p)return;
        document.getElementById('f_name').value=p.name||'';
        document.getElementById('f_summary').value=p.summary||'';
        document.getElementById('f_cover').value=p.cover_url||'';
        document.getElementById('f_repo').value=p.repo_url||'';
        document.getElementById('f_home').value=p.home_url||'';
        document.getElementById('f_demo').value=p.demo_url||'';
        document.getElementById('f_tags').value=(p.tags||[]).join(', ');
        document.getElementById('f_sort').value=p.sort_order||0;
        document.getElementById('f_pub').value=String(p.published);
        document.getElementById('f_detail').value=p.detail_md||'';
      });
    }
    wrap.style.display='block';
  }

  function save(){
    var err=document.getElementById('formErr');
    err.textContent='';
    var body={
      name:document.getElementById('f_name').value,
      summary:document.getElementById('f_summary').value,
      cover_url:document.getElementById('f_cover').value,
      repo_url:document.getElementById('f_repo').value,
      home_url:document.getElementById('f_home').value,
      demo_url:document.getElementById('f_demo').value,
      detail_md:document.getElementById('f_detail').value,
      tags:document.getElementById('f_tags').value.split(/[,，]/).map(function(s){return s.trim();}).filter(Boolean),
      sort_order:parseInt(document.getElementById('f_sort').value||'0',10),
      published:document.getElementById('f_pub').value==='true'
    };
    if(!body.name||!body.tags.length){err.textContent='name and tags are required · 名称和标签必填';return;}
    var url=editing?'/api/admin/projects/'+editing:'/api/admin/projects';
    var method=editing?'PUT':'POST';
    fetch(url,{method:method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d};});})
      .then(function(res){if(res.ok&&res.d.code===0){wrap.style.display='none';load();}else{err.textContent='save failed · 保存失败';}})
      .catch(function(){err.textContent='network error · 网络异常';});
  }

  document.getElementById('newBtn').addEventListener('click',function(e){e.preventDefault();openForm(null);});
  document.getElementById('saveBtn').addEventListener('click',save);
  document.getElementById('cancelBtn').addEventListener('click',function(){wrap.style.display='none';});
  load();
})();
</script>
</body>
</html>
