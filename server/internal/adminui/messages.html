<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>messages — T-Dwag admin</title>
<link rel="preload" href="/admin-assets/fonts/pixel-core.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/admin-assets/admin.css">
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Admin">
    <a class="brand" href="/admin/articles">t-dwag<i>@blog</i><small>admin console</small></a>
    <div class="navs">
      <a class="nv" href="/admin/articles">articles</a>
      <a class="nv" href="/admin/projects">projects</a>
      <a class="nv" href="/admin/messages" aria-current="page">messages</a>
      <a class="nv" href="/admin/settings">settings</a>
    </div>
    <div class="side-foot">
      <span class="st" id="st">connected</span>
      <a href="/admin/logout">logout ↗</a>
    </div>
  </nav>
  <div class="main">
    <div class="strip">
      <span>t-dwag@blog:<b>~/admin/messages</b></span>
      <span class="meta" id="count"></span>
    </div>
    <div class="page">
      <header class="head">
        <p class="meta">ls ~/messages --pending</p>
        <h1>Messages<span class="zh">留言审核 · 只有 approved 才会出现在公开留言板</span></h1>
        <p class="lede">IP and user agent stay here — visitors never see them.<span class="zh-i">IP / UA 仅后台可见</span></p>
      </header>
      <section class="pane"><span class="pt">queue</span>
        <div id="list"></div>
        <div id="confirmStage"></div>
      </section>
    </div>
  </div>
</div>
<script src="/admin-assets/admin.js"></script>
<script>
(function(){
  var list=document.getElementById('list');
  var stage=document.getElementById('confirmStage');

  function pill(st){
    return st==='approved'?'<span class="pill on">approved</span>':st==='rejected'?'<span class="pill">rejected</span>':'<span class="pill">pending</span>';
  }
  function note(en,zh,cls){
    var s=document.createElement('p');
    s.className=cls||'meta';
    s.appendChild(document.createTextNode(en));
    if(zh){var z=document.createElement('span'); z.className='zh-i'; z.textContent=zh; s.appendChild(z);}
    return s.outerHTML;
  }

  function load(){
    fetch('/api/admin/messages').then(function(r){
      if(r.status===401){location.href='/admin/login';throw new Error('redirect');}
      return r.json();
    }).then(function(env){
      var items=env.data||[];
      var pending=items.filter(function(m){return m.status!=='approved';}).length;
      document.getElementById('count').textContent=items.length+' messages · '+pending+' to review';
      if(!items.length){list.innerHTML=note('no messages yet','暂无留言');return;}
      list.innerHTML=items.map(function(m){
        var acts='';
        if(m.status!=='approved')acts+='<button class="go" data-id="'+m.id+'" data-a="approved" type="button">approve</button>';
        if(m.status!=='rejected')acts+='<button class="btn2" data-id="'+m.id+'" data-a="rejected" type="button">reject</button>';
        acts+='<a href="#" class="danger" data-del="'+m.id+'" data-nick="'+m.nickname+'">delete</a>';
        return '<div class="msg">'+
          '<div class="msg-head"><span><b>'+m.nickname+'</b> · '+pill(m.status)+'</span>'+
          '<span class="meta">'+m.created_at+' · IP '+m.ip+' · '+(m.user_agent||'-')+'</span></div>'+
          '<div class="content">'+m.content+'</div>'+
          '<div class="acts">'+acts+'</div></div>';
      }).join('');

      list.querySelectorAll('[data-id]').forEach(function(b){b.addEventListener('click',function(){
        fetch('/api/admin/messages/'+b.getAttribute('data-id'),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:b.getAttribute('data-a')})})
          .then(function(r){if(r.ok)load();});
      });});

      list.querySelectorAll('[data-del]').forEach(function(a){a.addEventListener('click',function(e){
        e.preventDefault();
        var id=a.getAttribute('data-del');
        var nick=a.getAttribute('data-nick');
        AdminConfirm(stage,'delete message from','"'+nick+'"','删除后不可恢复',function(){
          fetch('/api/admin/messages/'+id,{method:'DELETE'}).then(function(r){ if(r.ok) load(); });
        });
      });});
    }).catch(function(e){
      if(e.message!=='redirect') list.innerHTML=note('failed to load','加载失败，稍后再试','err');
    });
  }
  load();
})();
</script>
</body>
</html>
