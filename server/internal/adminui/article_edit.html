<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>article — T-Dwag admin</title>
<link rel="preload" href="/admin-assets/fonts/pixel-core.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/admin-assets/admin.css">
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Admin">
    <a class="brand" href="/admin/articles">t-dwag<i>@blog</i><small>admin console</small></a>
    <div class="navs">
      <a class="nv" href="/admin/articles" aria-current="page">articles</a>
      <a class="nv" href="/admin/projects">projects</a>
      <a class="nv" href="/admin/messages">messages</a>
      <a class="nv" href="/admin/settings">settings</a>
    </div>
    <div class="side-foot">
      <span class="st" id="st">connected</span>
      <a href="/admin/logout">logout ↗</a>
    </div>
  </nav>
  <div class="main">
    <div class="strip">
      <span>t-dwag@blog:<b>~/admin/article</b></span>
      <span class="meta">markdown → preview</span>
    </div>
    <div class="page">
      <header class="head">
        <h1 id="pageTitle">New article<span class="zh">新建文章</span></h1>
      </header>
      <section class="pane"><span class="pt">editor</span>
        <div class="grid">
          <div>
            <label class="field"><span>slug</span><input type="text" id="slug" placeholder="my-article"></label>
            <label class="field"><span>title *</span><input type="text" id="title" placeholder="文章标题"></label>
            <label class="field"><span>summary</span><input type="text" id="summary" placeholder="一句话描述"></label>
            <label class="field"><span>tags *<i class="hint">逗号分隔</i></span><input type="text" id="tags" placeholder="go, cache"></label>
            <label class="field"><span>cover url</span><input type="text" id="cover_url" placeholder="https://…"></label>
            <div class="field-row">
              <label class="field" style="flex:1"><span>status</span>
                <select id="status"><option value="draft">draft</option><option value="published">published</option></select>
              </label>
              <label class="field" style="flex:1"><span>pinned<i class="hint">置顶</i></span>
                <select id="is_pinned"><option value="false">no</option><option value="true">yes</option></select>
              </label>
            </div>
            <label class="field"><span>content (markdown)</span><textarea id="content_md" placeholder="# 标题&#10;&#10;正文…"></textarea></label>
            <div class="rowline">
              <button class="btn2" id="previewBtn" type="button">preview →</button>
              <button class="go" id="saveDraft" type="button">save draft</button>
              <button class="go" id="savePub" type="button">save &amp; publish</button>
            </div>
            <p class="err" id="err" style="margin-top:14px;min-height:20px"></p>
          </div>
          <div>
            <p class="meta"># preview<i class="hint">goldmark 渲染，无 KaTeX</i></p>
            <div class="preview" id="preview">…</div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
<script>
(function(){
  var id=null;
  var q=location.pathname.split('/');
  var last=q[q.length-1];
  if(last!=='new')id=last;

  function setTitle(text,zh){
    document.getElementById('pageTitle').innerHTML=text+'<span class="zh">'+zh+'</span>';
  }

  if(id){
    setTitle('Edit article #'+id,'编辑文章');
    fetch('/api/admin/articles').then(function(r){return r.json();}).then(function(env){
      var a=(env.data||[]).find(function(x){return String(x.id)===String(id);});
      if(!a)return;
      document.getElementById('slug').value=a.slug||'';
      document.getElementById('title').value=a.title||'';
      document.getElementById('summary').value=a.summary||'';
      document.getElementById('tags').value=(a.tags||[]).join(', ');
      document.getElementById('cover_url').value=a.cover_url||'';
      document.getElementById('status').value=a.status||'draft';
      document.getElementById('is_pinned').value=String(a.is_pinned);
      document.getElementById('content_md').value=a.content_md||'';
      doPreview();
    });
  }

  function read(){
    return {
      slug:document.getElementById('slug').value,
      title:document.getElementById('title').value,
      summary:document.getElementById('summary').value,
      content_md:document.getElementById('content_md').value,
      tags:document.getElementById('tags').value.split(/[,，]/).map(function(s){return s.trim();}).filter(Boolean),
      cover_url:document.getElementById('cover_url').value,
      is_pinned:document.getElementById('is_pinned').value==='true',
      status:document.getElementById('status').value
    };
  }

  function doPreview(){
    var body=read();
    fetch('/api/admin/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content_md:body.content_md})})
      .then(function(r){return r.json();})
      .then(function(env){document.getElementById('preview').innerHTML=env.data&&env.data.html?env.data.html:'…';})
      .catch(function(){document.getElementById('preview').innerHTML='<span class="err">preview failed<span class="zh-i">预览失败</span></span>';});
  }

  function save(statusOverride){
    var body=read();
    if(statusOverride)body.status=statusOverride;
    var err=document.getElementById('err');
    err.textContent='';
    if(!body.title||!body.tags.length){err.textContent='title and tags are required · 标题和标签必填';return;}
    var url=id?'/api/admin/articles/'+id:'/api/admin/articles';
    var method=id?'PUT':'POST';
    fetch(url,{method:method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d};});})
      .then(function(res){
        if(res.ok&&res.d.code===0){location.href='/admin/articles';}
        else{err.textContent='save failed · 保存失败';}
      })
      .catch(function(){err.textContent='network error · 网络异常';});
  }

  document.getElementById('previewBtn').addEventListener('click',doPreview);
  document.getElementById('saveDraft').addEventListener('click',function(){save('draft');});
  document.getElementById('savePub').addEventListener('click',function(){save('published');});
  doPreview();
})();
</script>
</body>
</html>
