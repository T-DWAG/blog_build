<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>go /admin/article — 从气象到代码</title>
<style>
@font-face {
  font-family: "Fusion Pixel";
  src: url("/admin-assets/fonts/fusion-pixel-12px-proportional-zh_hans.subset.woff2") format("woff2");
  font-display: swap;
}
@font-face {
  font-family: "Fusion Pixel Full";
  src: url("/admin-assets/fonts/fusion-pixel-12px-proportional-zh_hans.ttf.woff2") format("woff2");
  font-display: swap;
}
@font-face {
  font-family: "Fusion Pixel Mono";
  src: url("/admin-assets/fonts/fusion-pixel-12px-monospaced-zh_hans.subset.woff2") format("woff2");
  font-display: swap;
}
@font-face {
  font-family: "Fusion Pixel Mono Full";
  src: url("/admin-assets/fonts/fusion-pixel-12px-monospaced-zh_hans.ttf.woff2") format("woff2");
  font-display: swap;
}

:root{--black:#000;--white:#fff;--green:#00ff41;--lt-red:#ff5f57;--lt-yellow:#febc2e;--lt-green:#28c840;
--fp:"Fusion Pixel","Fusion Pixel Full","PingFang SC","Microsoft YaHei",sans-serif;
--mono:"Fusion Pixel Mono","Fusion Pixel Mono Full","Courier New","PingFang SC",monospace}
*{box-sizing:border-box}
body{margin:0;min-width:320px;color:var(--black);background:var(--black);border:12px solid var(--black);font-family:var(--fp);font-size:15px;line-height:1.85;cursor:url("/admin-assets/assets/cursor_default.svg") 0 0,default}
a,button,input,textarea,select{cursor:url("/admin-assets/assets/cursor_pointer.svg") 0 0,pointer}
a{color:inherit;text-decoration:none}
.pixel-round{clip-path:polygon(0 4px,2px 4px,4px 2px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,calc(100% - 2px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 2px) calc(100% - 4px),calc(100% - 4px) calc(100% - 2px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 2px),2px calc(100% - 4px),0 calc(100% - 4px))}
.win{background:var(--white);max-width:1120px;margin:0 auto;border:4px solid var(--black);box-shadow:12px 12px 0 var(--black)}
.winbar{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:4px solid var(--black);font-family:var(--mono);font-size:12px}
.lights{display:flex;gap:5px}.lights i{width:10px;height:10px;border:1px solid var(--black);display:block}
.r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
.winbar-path{margin-left:6px;white-space:nowrap;overflow:hidden}
.nav{display:flex;flex-wrap:wrap;border-bottom:4px solid var(--black);font-family:var(--mono);font-size:13px}
.nav a{padding:10px 16px;border-right:1px solid var(--black)}
.nav a:hover{background:var(--black);color:var(--white)}
.nav a.on{background:var(--black);color:var(--green)}
.main{padding:24px}
h1{font-size:18px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
label{display:block;font-family:var(--mono);font-size:12px;margin:12px 0 4px}
input[type=text],textarea,select{width:100%;border:2px solid var(--black);background:var(--white);padding:8px 10px;font-family:var(--mono);font-size:14px;color:var(--black);outline:none}
textarea{min-height:340px;resize:vertical;line-height:1.6}
input:focus,textarea:focus{box-shadow:4px 4px 0 var(--black)}
.preview{border:2px solid var(--black);min-height:340px;padding:12px 16px;overflow:auto;font-size:14px}
.preview h1{font-size:20px}.preview h2{font-size:17px}.preview h3{font-size:15px}
.preview pre{border:1px solid var(--black);padding:10px;overflow:auto;background:#f5f5f5}
.preview code{font-family:var(--mono);font-size:13px}
.preview img{max-width:100%}
.preview a{text-decoration:underline}
.preview a:hover{color:var(--green)}
.rowbar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:2px solid var(--black);background:var(--black);color:var(--white);padding:8px 16px;font-family:var(--mono);font-size:13px}
.btn:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--white),3px 3px 0 var(--black);color:var(--green)}
.btn.ghost{background:var(--white);color:var(--black)}
.btn.ghost:hover{color:var(--green)}
.note{font-family:var(--mono);font-size:12px;opacity:.7}
.err{font-family:var(--mono);font-size:12px;color:var(--green);min-height:18px;margin-top:8px}
/* 锁定系统色：自动填充/选中/光标/滚动条统一像素风 */\ninput:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{-webkit-text-fill-color:var(--black);-webkit-box-shadow:0 0 0 1000px var(--white) inset;transition:background-color 9999s ease-out 0s}\n::selection{background:var(--black);color:var(--green)}\ninput,textarea,select{caret-color:var(--green)}\n::-webkit-scrollbar{width:12px;height:12px}\n::-webkit-scrollbar-track{background:var(--white)}\n::-webkit-scrollbar-thumb{background:var(--black);border:2px solid var(--white)}\n::-webkit-scrollbar-thumb:hover{background:var(--green)}
</style>
</head>
<body>
<div class="win pixel-round">
  <header class="winbar">
    <div class="lights" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <span class="winbar-path">t-dwag@blog: <b>~/admin/article</b></span>
  </header>
  <nav class="nav">
    <a class="on" href="/admin/articles">articles</a>
    <a href="/admin/projects">projects</a>
    <a href="/admin/messages">messages</a>
    <a href="/admin/settings">settings</a>
    <a href="/admin/logout">logout</a>
  </nav>
  <div class="main">
    <h1 id="pageTitle">新建文章</h1>
    <div class="grid">
      <div>
        <label>SLUG</label><input type="text" id="slug" placeholder="my-article">
        <label>TITLE *</label><input type="text" id="title" placeholder="文章标题">
        <label>SUMMARY</label><input type="text" id="summary" placeholder="一句话描述">
        <label>TAGS *（逗号分隔）</label><input type="text" id="tags" placeholder="go, cache">
        <label>COVER URL</label><input type="text" id="cover_url" placeholder="https://…">
        <label>STATUS</label>
        <select id="status">
          <option value="draft">draft</option>
          <option value="published">published</option>
        </select>
        <label>PINNED</label>
        <select id="is_pinned">
          <option value="false">否</option>
          <option value="true">是</option>
        </select>
        <label>CONTENT (Markdown)</label>
        <textarea id="content_md" placeholder="# 标题&#10;&#10;正文…"></textarea>
        <div class="rowbar">
          <button class="btn ghost" id="previewBtn" type="button">预览 →</button>
          <button class="btn" id="saveDraft" type="button">存草稿</button>
          <button class="btn" id="savePub" type="button">保存并发布</button>
        </div>
        <p class="err" id="err"></p>
      </div>
      <div>
        <p class="note"># 预览（goldmark 渲染，无 KaTeX）</p>
        <div class="preview" id="preview">…</div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var id=null;
  var q=location.pathname.split('/');
  var last=q[q.length-1];
  if(last!=='new')id=last;

  var title=document.getElementById('title');
  if(id){
    document.getElementById('pageTitle').textContent='编辑文章 #'+id;
    fetch('/api/admin/articles').then(function(r){return r.json();}).then(function(env){
      var a=(env.data||[]).find(function(x){return String(x.id)===String(id);});
      if(!a)return;
      document.getElementById('slug').value=a.slug||'';
      title.value=a.title||'';
      document.getElementById('summary').value=a.summary||'';
      document.getElementById('tags').value=(a.tags||[]).join(', ');
      document.getElementById('cover_url').value=a.cover_url||'';
      document.getElementById('status').value=a.status||'draft';
      document.getElementById('is_pinned').value=String(a.is_pinned);
      document.getElementById('content_md').value=a.content_md||'';
      doPreview();
    });
  }

  function read(){
    return {
      slug:document.getElementById('slug').value,
      title:title.value,
      summary:document.getElementById('summary').value,
      content_md:document.getElementById('content_md').value,
      tags:document.getElementById('tags').value.split(/[,，]/).map(function(s){return s.trim();}).filter(Boolean),
      cover_url:document.getElementById('cover_url').value,
      is_pinned:document.getElementById('is_pinned').value==='true',
      status:document.getElementById('status').value
    };
  }
  function doPreview(){
    var body=read();
    fetch('/api/admin/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content_md:body.content_md})})
      .then(function(r){return r.json();})
      .then(function(env){document.getElementById('preview').innerHTML=env.data&&env.data.html?env.data.html:'…';})
      .catch(function(){document.getElementById('preview').innerHTML='<span style="color:var(--green)">> error: 预览失败</span>';});
  }
  function save(statusOverride){
    var body=read();
    if(statusOverride)body.status=statusOverride;
    var err=document.getElementById('err');
    err.textContent='';
    if(!body.title||!body.tags.length){err.textContent='> error: 标题和标签必填';return;}
    var url=id?'/api/admin/articles/'+id:'/api/admin/articles';
    var method=id?'PUT':'POST';
    fetch(url,{method:method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d};});})
      .then(function(res){
        if(res.ok&&res.d.code===0){location.href='/admin/articles';}
        else{err.textContent='> error: 保存失败';}
      })
      .catch(function(){err.textContent='> error: 网络错误';});
  }
  document.getElementById('previewBtn').addEventListener('click',doPreview);
  document.getElementById('saveDraft').addEventListener('click',function(){save('draft');});
  document.getElementById('savePub').addEventListener('click',function(){save('published');});
  doPreview();
})();
</script>
</body>
</html>
