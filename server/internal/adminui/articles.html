<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>articles — T-Dwag admin</title>
<link rel="preload" href="/admin-assets/fonts/pixel-core.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/admin-assets/admin.css">
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Admin">
    <a class="brand" href="/admin/articles">t-dwag<i>@blog</i><small>admin console</small></a>
    <div class="navs">
      <a class="nv" href="/admin/articles" aria-current="page">articles</a>
      <a class="nv" href="/admin/projects">projects</a>
      <a class="nv" href="/admin/messages">messages</a>
      <a class="nv" href="/admin/settings">settings</a>
    </div>
    <div class="side-foot">
      <span class="st" id="st">connected</span>
      <a href="/admin/logout">logout ↗</a>
    </div>
  </nav>
  <div class="main">
    <div class="strip">
      <span>t-dwag@blog:<b>~/admin/articles</b></span>
      <span class="meta" id="count"></span>
    </div>
    <div class="page">
      <header class="head">
        <p class="meta">ls ~/articles --all</p>
        <h1>Articles<span class="zh">文章管理 · 置顶 / 草稿 / 发布状态一览</span></h1>
        <p class="lede">Publishing is two steps: save as draft, then publish.<span class="zh-i">先存草稿，确认后再发布</span></p>
      </header>
      <section class="pane"><span class="pt">list</span>
        <div class="rowline"><a class="go" href="/admin/articles/new">+ new article</a></div>
        <table class="tbl">
          <thead><tr><th>ID</th><th>TITLE</th><th>STATUS</th><th>PINNED</th><th>TAGS</th><th>DATE</th><th>ACTIONS</th></tr></thead>
          <tbody id="rows"><tr><td colspan="7"><span class="meta">loading…</span></td></tr></tbody>
        </table>
        <div id="confirmStage"></div>
      </section>
    </div>
  </div>
</div>
<script src="/admin-assets/admin.js"></script>
<script>
(function(){
  var rows=document.getElementById('rows');
  var stage=document.getElementById('confirmStage');

  function cell(en,zh,cls){
    var s=document.createElement('span');
    s.className=cls||'meta';
    s.appendChild(document.createTextNode(en));
    if(zh){var z=document.createElement('span'); z.className='zh-i'; z.textContent=zh; s.appendChild(z);}
    return '<tr><td colspan="7">'+s.outerHTML+'</td></tr>';
  }

  function load(){
    fetch('/api/admin/articles').then(function(r){
      if(r.status===401){location.href='/admin/login';throw new Error('redirect');}
      return r.json();
    }).then(function(env){
      var items=env.data||[];
      var published=items.filter(function(a){return a.status==='published';}).length;
      document.getElementById('count').textContent=items.length+' articles · '+published+' published';
      if(!items.length){rows.innerHTML=cell('no articles yet','还没有文章');return;}
      rows.innerHTML=items.map(function(a){
        var status=a.status==='published'?'<span class="pill on">published</span>':'<span class="pill">draft</span>';
        var pinned=a.is_pinned?'<span class="ps" title="pinned">*</span>':'<span class="meta">—</span>';
        var tags=(a.tags||[]).map(function(t){return '<span class="tag">'+t+'</span>';}).join('');
        var date=(a.published_at||a.created_at||'').slice(0,10);
        return '<tr>'+
          '<td class="meta">'+a.id+'</td>'+
          '<td>'+a.title+'</td>'+
          '<td>'+status+'</td>'+
          '<td>'+pinned+'</td>'+
          '<td>'+tags+'</td>'+
          '<td class="meta">'+date+'</td>'+
          '<td class="act"><a href="/admin/articles/'+a.id+'">edit</a><a href="#" class="danger" data-del="'+a.id+'" data-slug="'+a.slug+'">delete</a></td>'+
        '</tr>';
      }).join('');
      rows.querySelectorAll('[data-del]').forEach(function(a){
        a.addEventListener('click',function(e){
          e.preventDefault();
          var id=a.getAttribute('data-del');
          var slug=a.getAttribute('data-slug');
          AdminConfirm(stage,'delete article','"'+slug+'"','删除后不可恢复',function(){
            fetch('/api/admin/articles/'+id,{method:'DELETE'}).then(function(r){ if(r.ok) load(); });
          });
        });
      });
    }).catch(function(e){
      if(e.message!=='redirect') rows.innerHTML=cell('failed to load','加载失败，稍后再试','err');
    });
  }
  load();
})();
</script>
</body>
</html>
